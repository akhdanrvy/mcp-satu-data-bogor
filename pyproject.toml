[project]
name = "mcp-bogor"
version = "0.1.0"
description = "Server MCP untuk portal Satu Data Kota Bogor (X-Assistant Citya AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",            # FastMCP dari mcp.server.fastmcp + transport streamable-http
    "pydantic>=2.7,<3",        # model amplop, validasi parameter, JSON Schema (KT-01)
    "pydantic-settings>=2.3",  # config.py: semua nilai dari env/.env
    "httpx>=0.27",             # klien portal, hanya dipakai adaptor
    "starlette>=0.37",         # file server :8799 (ikut mcp; eksplisit karena diimpor langsung)
    "uvicorn>=0.30",           # menjalankan file server dan transport HTTP
    "pyyaml>=6",               # kartu metrik YAML (Langkah 10)
]

[project.scripts]
mcp-bogor = "mcp_bogor.__main__:main"
mcp-bogor-sync = "mcp_bogor.sync_worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bogor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke test ke portal asli tidak ikut bawaan; `-m smoke` di baris perintah menimpa ini.
addopts = "-ra -m 'not smoke'"
markers = [
    "smoke: memanggil portal asli; hanya dijalankan atas izin Akhdan",
]

[tool.coverage.run]
source = ["mcp_bogor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
